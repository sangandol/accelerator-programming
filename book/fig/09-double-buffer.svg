<text x="119" y="141.2" text-anchor="end" font-size="12" fill="#666">输入槽 1</text>
<text x="119" y="189.2" text-anchor="end" font-size="12" fill="#666">输出槽 0</text>
<text x="119" y="237.2" text-anchor="end" font-size="12" fill="#666">输出槽 1</text>
<text x="202.5" y="59.2" text-anchor="middle" font-size="12" fill="#666">迭代 0</text>
