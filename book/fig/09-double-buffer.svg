<text x="230" y="22.9" text-anchor="middle" font-size="14" fill="#222">同一槽位在不同时刻属于不同块</text>
<text x="202.5" y="93.2" text-anchor="middle" font-size="12" fill="#3a5a8c">块 0</text>
<text x="357.5" y="93.2" text-anchor="middle" font-size="12" fill="#3a5a8c">空闲</text>
<text x="512.5" y="93.2" text-anchor="middle" font-size="12" fill="#3a5a8c">块 2</text>
<text x="202.5" y="141.2" text-anchor="middle" font-size="12" fill="#3a5a8c">预取块 1</text>
<text x="357.5" y="141.2" text-anchor="middle" font-size="12" fill="#3a5a8c">块 1</text>
<text x="512.5" y="141.2" text-anchor="middle" font-size="12" fill="#3a5a8c">空闲</text>
