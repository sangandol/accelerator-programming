<text x="512.5" y="189.2" text-anchor="middle" font-size="12" fill="#b45f06">等写回后算块 2</text>
<text x="202.5" y="237.2" text-anchor="middle" font-size="12" fill="#b45f06">空闲</text>
<text x="357.5" y="237.2" text-anchor="middle" font-size="12" fill="#b45f06">算块 1</text>
<text x="512.5" y="237.2" text-anchor="middle" font-size="12" fill="#b45f06">写回块 1</text>
