<svg xmlns="http://www.w3.org/2000/svg" width="658" height="247" viewBox="13 -2 658 247" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="14">
<rect x="13" y="-2" width="658" height="247" rx="8" fill="#ffffff"/>
<rect x="25" y="88" width="114" height="54" rx="6" fill="#e3f2e5" stroke="#2e7d32" stroke-width="1.6"/>
<rect x="155" y="88" width="114" height="54" rx="6" fill="#e8f0fb" stroke="#3a5a8c" stroke-width="1.6"/>
<rect x="285" y="88" width="114" height="54" rx="6" fill="#e8f0fb" stroke="#3a5a8c" stroke-width="1.6"/>
<rect x="415" y="88" width="114" height="54" rx="6" fill="#e8f0fb" stroke="#3a5a8c" stroke-width="1.6"/>
<rect x="545" y="88" width="114" height="54" rx="6" fill="#efefef" stroke="#555555" stroke-width="1.6"/>
<text x="330" y="24.9" text-anchor="middle" font-size="14" fill="#222">读入延迟 7，计算每块 2，需要 1 + ceil(7/2) = 5 槽</text>
<text x="82" y="67.9" text-anchor="middle" font-size="14" fill="#222">槽 0</text>
<text x="82" y="119.9" text-anchor="middle" font-size="14" fill="#2e7d32">算块 0</text>
<text x="82" y="177.2" text-anchor="middle" font-size="12" fill="#666">7–9 占用</text>
<text x="212" y="67.9" text-anchor="middle" font-size="14" fill="#222">槽 1</text>
<text x="212" y="119.9" text-anchor="middle" font-size="14" fill="#3a5a8c">读块 1</text>
<text x="212" y="177.2" text-anchor="middle" font-size="12" fill="#666">2 发起</text>
<text x="342" y="67.9" text-anchor="middle" font-size="14" fill="#222">槽 2</text>
<text x="342" y="119.9" text-anchor="middle" font-size="14" fill="#3a5a8c">读块 2</text>
<text x="342" y="177.2" text-anchor="middle" font-size="12" fill="#666">4 发起</text>
<text x="472" y="67.9" text-anchor="middle" font-size="14" fill="#222">槽 3</text>
<text x="472" y="119.9" text-anchor="middle" font-size="14" fill="#3a5a8c">读块 3</text>
<text x="472" y="177.2" text-anchor="middle" font-size="12" fill="#666">6 发起</text>
<text x="602" y="67.9" text-anchor="middle" font-size="14" fill="#222">槽 4</text>
<text x="602" y="119.9" text-anchor="middle" font-size="14" fill="#555555">准备块 4</text>
<text x="602" y="177.2" text-anchor="middle" font-size="12" fill="#666">8 发起</text>
<text x="330" y="229.2" text-anchor="middle" font-size="12" fill="#666">时刻 7 的截面；输入槽从发起读入到消费者结束一直存活</text>
</svg>
