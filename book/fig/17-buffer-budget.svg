<text x="500" y="147.1" text-anchor="middle" font-size="13" fill="#6a3d9a">f32 累加 scratch</text>
<text x="320" y="289.2" text-anchor="middle" font-size="12" fill="#666">显式字节 = 4(bM·bK+bK·bN) + 8bM·bN（双缓冲）</text>
<text x="320" y="329.2" text-anchor="middle" font-size="12" fill="#666">还需临时值与布局填充；增大 K 块增容量，不提高输入复用强度</text>
