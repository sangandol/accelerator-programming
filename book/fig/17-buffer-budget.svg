<text x="320" y="24.9" text-anchor="middle" font-size="14" fill="#222">bf16 的 A、B、输出块；f32 的累加器</text>
<text x="100" y="103.2" text-anchor="middle" font-size="12" fill="#3a5a8c">A0</text>
<text x="240" y="103.2" text-anchor="middle" font-size="12" fill="#3a5a8c">A1</text>
