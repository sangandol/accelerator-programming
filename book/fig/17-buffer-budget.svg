<text x="240" y="151.2" text-anchor="middle" font-size="12" fill="#b45f06">B1</text>
<text x="100" y="199.2" text-anchor="middle" font-size="12" fill="#2e7d32">C0</text>
<text x="240" y="199.2" text-anchor="middle" font-size="12" fill="#2e7d32">C1</text>
<text x="24" y="103.2" text-anchor="end" font-size="12" fill="#666">A 输入</text>
<text x="24" y="151.2" text-anchor="end" font-size="12" fill="#666">B 输入</text>
<text x="24" y="199.2" text-anchor="end" font-size="12" fill="#666">C 输出</text>
