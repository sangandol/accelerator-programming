<text x="450" y="210.2" text-anchor="middle" font-size="12" fill="#3a5a8c">数前导零</text>
<text x="450" y="262.2" text-anchor="middle" font-size="12" fill="#b45f06">规格化：左移</text>
<text x="450" y="314.2" text-anchor="middle" font-size="12" fill="#3a5a8c">舍入</text>
<text x="450" y="354.2" text-anchor="middle" font-size="12" fill="#666">面积 <tspan font-style="italic">O</tspan>(<tspan font-style="italic">p</tspan> log <tspan font-style="italic">p</tspan>)：两个移位器和一个加法器</text>
