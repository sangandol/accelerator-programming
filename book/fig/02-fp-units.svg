<text x="237" y="53.9" text-anchor="middle" font-size="11" fill="#555555">指数相加</text>
<text x="114" y="198.2" text-anchor="middle" font-size="12" fill="#666">面积 Θ(<tspan font-style="italic">p</tspan><tspan dy="-5" font-size="8.6">2</tspan><tspan dy="5">)，几乎全在尾数乘法器</tspan></text>
<text x="450" y="18.9" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">浮点加法</text>
<text x="450" y="54.2" text-anchor="middle" font-size="12" fill="#555555">比较指数，求差 <tspan font-style="italic">d</tspan></text>
