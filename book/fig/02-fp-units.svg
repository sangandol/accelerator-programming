<text x="130" y="18.9" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">浮点乘法</text>
<text x="114" y="54.2" text-anchor="middle" font-size="12" fill="#b45f06">尾数相乘：<tspan font-style="italic">p</tspan> × <tspan font-style="italic">p</tspan> 乘法器</text>
