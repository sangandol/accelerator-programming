<text x="330" y="22.9" text-anchor="middle" font-size="14" fill="#222">32 层、头维度 128、bf16：KV 的容量乘法</text>
<text x="222" y="78.2" text-anchor="end" font-size="12" fill="#222">B=1, T=8192, KV头=8</text>
<text x="318.5" y="78.2" text-anchor="start" font-size="12" fill="#666">1 GiB</text>
<text x="222" y="103.2" text-anchor="end" font-size="12" fill="#222">B=4, T=8192, KV头=8</text>
<text x="566" y="103.2" text-anchor="start" font-size="12" fill="#666">4 GiB</text>
<text x="222" y="128.2" text-anchor="end" font-size="12" fill="#222">B=1, T=32768, KV头=8</text>
<text x="566" y="128.2" text-anchor="start" font-size="12" fill="#666">4 GiB</text>
