<text x="566" y="153.2" text-anchor="start" font-size="12" fill="#666">4 GiB</text>
<text x="330" y="249.2" text-anchor="middle" font-size="12" fill="#666">基准为 1 GiB；任一因子扩大四倍，载荷也扩大四倍</text>
