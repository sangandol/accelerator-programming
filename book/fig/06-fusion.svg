<text x="40" y="14.6" text-anchor="start" font-size="13" fill="#222">不融合：三个程序</text>
<text x="320" y="119.2" text-anchor="middle" font-size="12" fill="#555555">HBM</text>
<text x="125" y="52.2" text-anchor="middle" font-size="12" fill="#b45f06">程序 1：<tspan font-style="italic">t</tspan><tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6"> = 2</tspan><tspan font-style="italic">x</tspan></text>
<text x="84" y="88.2" text-anchor="start" font-size="12" fill="#3a5a8c">读</text>
<text x="166" y="88.2" text-anchor="end" font-size="12" fill="#2e7d32">写</text>
<text x="315" y="52.2" text-anchor="middle" font-size="12" fill="#b45f06">程序 2：<tspan font-style="italic">t</tspan><tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6"> = </tspan><tspan font-style="italic">t</tspan><tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6"> + 1</tspan></text>
<text x="274" y="88.2" text-anchor="start" font-size="12" fill="#3a5a8c">读</text>
<text x="356" y="88.2" text-anchor="end" font-size="12" fill="#2e7d32">写</text>
<text x="505" y="52.2" text-anchor="middle" font-size="12" fill="#b45f06">程序 3：<tspan font-style="italic">y</tspan> = tanh <tspan font-style="italic">t</tspan><tspan dy="3.6" font-size="8.6">2</tspan></text>
<text x="464" y="88.2" text-anchor="start" font-size="12" fill="#3a5a8c">读</text>
<text x="546" y="88.2" text-anchor="end" font-size="12" fill="#2e7d32">写</text>
<text x="610" y="119.2" text-anchor="start" font-size="12" fill="#666">HBM 读写 6 次</text>
<text x="40" y="164.6" text-anchor="start" font-size="13" fill="#222">融合：一个程序</text>
<text x="320" y="269.2" text-anchor="middle" font-size="12" fill="#555555">HBM</text>
<text x="325" y="202.2" text-anchor="middle" font-size="12" fill="#b45f06">一个程序：2<tspan font-style="italic">x</tspan>、+1、tanh，中间结果留在片上</text>
<text x="194" y="238.2" text-anchor="start" font-size="12" fill="#3a5a8c">读</text>
<text x="456" y="238.2" text-anchor="end" font-size="12" fill="#2e7d32">写</text>
<text x="610" y="269.2" text-anchor="start" font-size="12" fill="#666">HBM 读写 2 次</text>
