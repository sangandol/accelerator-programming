<text x="177" y="58.2" text-anchor="end" font-size="12" fill="#222">寄存器上限</text>
<text x="281" y="58.2" text-anchor="start" font-size="12" fill="#666">4 块</text>
<text x="177" y="83.2" text-anchor="end" font-size="12" fill="#222">共享内存上限</text>
