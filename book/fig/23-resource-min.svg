<text x="340" y="249.2" text-anchor="middle" font-size="12" fill="#666">取最小值：2 块 × 8 warp = 16 warp，算术占用率 25%</text>
<text x="340" y="289.2" text-anchor="middle" font-size="12" fill="#666">假设 256 线程/块、64 寄存器/线程、80 KiB 共享/块</text>
